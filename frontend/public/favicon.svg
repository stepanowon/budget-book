  <rect x="37" y="48" width="14" height="1.5" rx="0.75" fill="#1a73e8" opacity="0.3"/>
  <rect x="37" y="53" width="9"  height="1.5" rx="0.75" fill="#1a73e8" opacity="0.3"/>
